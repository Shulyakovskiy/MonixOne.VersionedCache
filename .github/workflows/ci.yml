name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test and pack
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker for Testcontainers
        run: |
          docker version
          docker info
          docker pull redis:7.4.1

      - name: Restore
        run: dotnet restore MonixOne.VersionedCache.sln --disable-parallel

      - name: Build
        run: >-
          dotnet build MonixOne.VersionedCache.sln --configuration Release --no-restore
          --disable-build-servers -m:1 -p:GeneratePackageOnBuild=false

      - name: Test, including Redis Testcontainers integration
        run: >-
          dotnet test MonixOne.VersionedCache.sln --configuration Release
          --no-build --no-restore

      - name: Pack
        run: >-
          dotnet pack src/MonixOne.VersionedCache/MonixOne.VersionedCache.csproj
          --configuration Release --no-build --no-restore --output artifacts/nuget
          -p:GeneratePackageOnBuild=false
