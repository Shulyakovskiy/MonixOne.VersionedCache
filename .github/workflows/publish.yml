name: Publish packages

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker for Testcontainers
        run: |
          docker version
          docker info
          docker pull redis:7.4.1

      - name: Restore
        run: dotnet restore MonixOne.VersionedCache.sln --disable-parallel

      - name: Build
        run: >-
          dotnet build MonixOne.VersionedCache.sln --configuration Release --no-restore
          --disable-build-servers -m:1 -p:GeneratePackageOnBuild=false

      - name: Test, including Redis Testcontainers integration
        run: >-
          dotnet test MonixOne.VersionedCache.sln --configuration Release
          --no-build --no-restore

      - name: Pack
        run: >-
          dotnet pack src/MonixOne.VersionedCache/MonixOne.VersionedCache.csproj
          --configuration Release --no-build --no-restore --output artifacts/nuget
          -p:GeneratePackageOnBuild=false

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_TEMPORARY_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --api-key "$NUGET_TEMPORARY_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
